slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # TF frames (ต้องตรงกับของนาย)
    map_frame: map
    odom_frame: odom
    base_frame: base_link_icp

    # Laser
    scan_topic: /scan

    # Mode
    mode: mapping
    do_loop_closing: true

    # กัน message filter queue เต็ม (ที่นายเจอ “queue is full”)
    throttle_scans: 1
    scan_queue_size: 200

    # แนะนำค่าเบื้องต้น
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 25.0
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0